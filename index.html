<style>
:root{
  --void:#04050d;
  --void-2:#070a18;
  --nebula-a:#1b1250;
  --nebula-b:#0a2d54;
  --glass:rgba(18,22,46,.55);
  --glass-2:rgba(12,16,34,.66);
  --line:rgba(140,160,230,.16);
  --line-2:rgba(140,160,230,.28);
  --gold:#ffce4d;
  --gold-bri:#ffe9a8;
  --gold-deep:#b07d12;
  --plasma:#54d9ff;
  --violet:#9a82ff;
  --ink:#eef1ff;
  --ink-dim:#a3abce;
  --ink-mute:#6c7397;
  --maxw:1240px;
  --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--void);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;font-size:17px;line-height:1.65;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
/* deep-space nebula wash behind the starfield */
.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 50% at 18% 8%, rgba(154,130,255,.18), transparent 60%),
    radial-gradient(55% 45% at 88% 12%, rgba(84,217,255,.14), transparent 60%),
    radial-gradient(80% 60% at 50% 120%, rgba(255,206,77,.10), transparent 55%),
    linear-gradient(180deg,#04050d 0%,#070a18 40%,#04050d 100%);
}
canvas#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
/* faint grid horizon, very subtle, far below */
.cosmos::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% 140%, rgba(255,206,77,.07), transparent 55%);}

a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px;position:relative;z-index:5}
.mono{font-family:'Space Mono',monospace}
.eyebrow{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:var(--plasma);display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:22px;height:1px;background:linear-gradient(90deg,var(--plasma),transparent)}
.display{font-family:'Sora',sans-serif;font-weight:800;line-height:.95;letter-spacing:-1px}
.rule{height:1px;border:0;background:linear-gradient(90deg,transparent,var(--line-2),transparent);margin:0}

/* luminous gold foil */
.foil{
  background:linear-gradient(180deg,#fff6d4 0%,var(--gold-bri) 26%,var(--gold) 52%,#e0a52a 74%,#8a5f10 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(255,206,77,.35));
}

/* ---------------- HEADER ---------------- */
header{position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(4,5,13,.86),rgba(4,5,13,.4));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--maxw);margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:13px;flex-shrink:0}
.brand .orb{position:relative;width:40px;height:40px;flex-shrink:0;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff3c4,var(--gold) 46%,#7a5410 88%);
  box-shadow:0 0 22px rgba(255,206,77,.55),inset 0 -3px 8px rgba(0,0,0,.4)}
.brand .orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px solid rgba(255,206,77,.4);transform:rotate(18deg)}
.brand .nm{font-family:'Sora';font-weight:800;font-size:19px;letter-spacing:.5px;line-height:1}
.brand .nm small{display:block;font-family:'Space Mono';font-weight:400;font-size:9px;letter-spacing:3px;
  color:var(--ink-mute);margin-top:5px}
nav.main{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav.main a{font-family:'Space Mono';font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink-dim);padding:10px 13px;border-radius:9px;transition:.18s;position:relative}
nav.main a:hover{color:var(--ink);background:rgba(140,160,230,.08)}
nav.main a.active{color:var(--gold)}
nav.main a.active::after{content:"";position:absolute;left:13px;right:13px;bottom:4px;height:2px;
  background:var(--gold);box-shadow:0 0 10px var(--gold);border-radius:2px}
.menu-btn{display:none;margin-left:auto;background:var(--glass);border:1px solid var(--line-2);
  color:var(--ink);border-radius:10px;padding:10px 14px;font-family:'Space Mono';font-size:12px;letter-spacing:2px}
@media(max-width:1000px){
  nav.main{display:none;position:fixed;inset:67px 0 auto 0;flex-direction:column;gap:0;
    background:rgba(7,10,24,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:8px;z-index:49}
  nav.main.open{display:flex}
  nav.main a{padding:15px 16px;font-size:14px;border-bottom:1px solid var(--line)}
  nav.main a.active::after{display:none}
  .menu-btn{display:block}
}

/* ---------------- VIEWS ---------------- */
.view{display:none}.view.active{display:block;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
section.block{padding:96px 0;position:relative;z-index:5}
section.block.tight{padding:60px 0}

/* ---------------- HERO ---------------- */
.hero{position:relative;min-height:90vh;display:flex;align-items:center;overflow:hidden;z-index:5}
/* golden planet horizon — the signature */
.planet{position:absolute;left:50%;bottom:-78vw;width:150vw;height:150vw;transform:translateX(-50%);
  border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 8%, #2a1d05 0%, #120c02 38%, transparent 60%);
  box-shadow:0 -2px 70px 8px rgba(255,206,77,.28), inset 0 6px 60px rgba(255,206,77,.12);}
.planet::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold-bri),var(--gold),transparent);
  filter:blur(.5px);box-shadow:0 0 26px 4px rgba(255,206,77,.6)}
/* jagged Defender terrain ridge on the horizon */
.terrain{position:absolute;left:0;right:0;bottom:calc(72vw - 2px);height:60px;z-index:2;pointer-events:none;opacity:.55}
.terrain svg{width:100%;height:100%;display:block}
.terrain path{fill:none;stroke:var(--gold);stroke-width:1.5;filter:drop-shadow(0 0 6px rgba(255,206,77,.7))}

.hero-inner{max-width:var(--maxw);margin:0 auto;padding:60px 26px;position:relative;z-index:6;width:100%}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center}
@media(max-width:920px){.hero-grid{grid-template-columns:1fr;gap:34px}.hero{min-height:auto;padding-top:30px}}
.hero h1{margin:18px 0 0;font-family:'Sora';font-weight:800;color:var(--gold);
  text-shadow:0 0 46px rgba(255,206,77,.32),0 3px 0 rgba(0,0,0,.35);
  font-size:clamp(58px,10vw,138px);line-height:.86;letter-spacing:-2px;text-transform:uppercase}
.tgold{color:var(--gold);text-shadow:0 0 30px rgba(255,206,77,.35)}
.hero .sub{display:flex;align-items:center;gap:16px;margin-top:20px;
  font-family:'Space Mono';font-size:clamp(13px,1.8vw,18px);letter-spacing:6px;color:var(--ink);text-transform:uppercase}
.hero .sub::before{content:"";width:42px;height:1px;background:var(--gold)}
.hero p.lede{font-size:18px;color:var(--ink-dim);max-width:50ch;margin:28px 0 32px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.btn{font-family:'Sora';font-weight:700;font-size:14px;letter-spacing:.5px;
  padding:15px 24px;border-radius:12px;border:1px solid transparent;display:inline-flex;align-items:center;gap:10px;transition:.18s}
.btn.primary{background:linear-gradient(180deg,var(--gold-bri),var(--gold) 58%,var(--gold-deep));color:#1c1304;
  box-shadow:0 10px 30px rgba(255,206,77,.3)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,206,77,.45)}
.btn.ghost{border-color:var(--line-2);color:var(--ink);background:rgba(140,160,230,.06)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}

/* milestone chip */
.chip{display:inline-flex;align-items:center;gap:16px;margin-top:30px;padding:14px 22px 14px 18px;
  border-radius:14px;background:var(--glass);border:1px solid var(--line-2);backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,.4)}
.chip .n{font-family:'Sora';font-weight:800;font-size:42px;line-height:.8;letter-spacing:-1px}
.chip .l{font-family:'Space Mono';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);max-width:22ch;line-height:1.5}

/* radar scanner orb */
.radar{position:relative;aspect-ratio:1;width:min(420px,80vw);margin:0 auto;border-radius:50%;
  background:radial-gradient(circle,rgba(84,217,255,.06),rgba(8,12,28,.5) 70%);
  border:1px solid var(--line-2);box-shadow:0 0 60px rgba(84,217,255,.12),inset 0 0 60px rgba(8,12,28,.6)}
.radar .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(140,160,230,.14)}
.radar .ring.r2{inset:16%}.radar .ring.r3{inset:34%}.radar .ring.r4{inset:52%}
.radar .cross,.radar .cross2{position:absolute;background:rgba(140,160,230,.14)}
.radar .cross{left:0;right:0;top:50%;height:1px}.radar .cross2{top:0;bottom:0;left:50%;width:1px}
.radar .sweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, rgba(255,206,77,.42), rgba(255,206,77,0) 70deg, transparent 360deg)}
@media (prefers-reduced-motion: no-preference){.radar .sweep{animation:spin 4.5s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.radar .blip{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 12px var(--gold);transform:translate(-50%,-50%)}
@media (prefers-reduced-motion: no-preference){.radar .blip{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.7)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.radar .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.radar .core .big{font-family:'Sora';font-weight:800;font-size:clamp(30px,7vw,52px);line-height:.85}
.radar .core .cap{font-family:'Space Mono';font-size:10px;letter-spacing:2px;color:var(--ink-dim);text-transform:uppercase;margin-top:8px}
.radar .ship{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%)}

/* ---------------- TELEMETRY STRIP ---------------- */
.telemetry{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tcell{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:24px 22px;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.tcell::before{content:"";position:absolute;top:0;left:0;width:34px;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tcell .v{font-family:'Sora';font-weight:800;font-size:38px;line-height:1;color:var(--gold)}
.tcell .k{font-family:'Space Mono';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-mute);margin-top:10px}
@media(max-width:760px){.telemetry{grid-template-columns:1fr 1fr}}

/* ---------------- SECTION HEADS ---------------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.sec-head h2{margin:12px 0 0;font-family:'Sora';font-weight:800;font-size:clamp(34px,5.4vw,62px);
  letter-spacing:-1.5px;line-height:.95;text-transform:uppercase;color:var(--gold);text-shadow:0 0 34px rgba(255,206,77,.28)}
.sec-head .lead{color:var(--ink-dim);max-width:54ch;margin:14px 0 0}

/* ---------------- CARDS (scanner contacts) ---------------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:18px}
.card{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--glass);backdrop-filter:blur(6px);cursor:pointer;transition:.22s;text-align:left;color:inherit;padding:0;width:100%;display:block}
.card:hover{border-color:var(--gold);transform:translateY(-5px);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 30px rgba(255,206,77,.12)}
.card .thumb{aspect-ratio:4/3;background:#080b1a;position:relative;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:.45s}
.card:hover .thumb img{transform:scale(1.07)}
.card .thumb.empty{display:grid;place-items:center}
.card .thumb.empty .ph{font-family:'Space Mono';font-size:11px;letter-spacing:1px;color:var(--ink-mute);text-align:center;line-height:1.9;opacity:.8}
.card .scan{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(transparent 60%,rgba(4,5,13,.85));opacity:.9}
.card .node{position:absolute;top:12px;left:12px;font-family:'Space Mono';font-size:10px;letter-spacing:1px;
  color:var(--plasma);background:rgba(4,5,13,.6);border:1px solid var(--line-2);padding:5px 8px;border-radius:7px}
.card .meta{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .meta h3{margin:0;font-family:'Sora';font-weight:700;font-size:16px;letter-spacing:.2px;text-transform:uppercase;color:var(--gold)}
.card .meta .ct{font-family:'Space Mono';font-size:11px;color:var(--gold);white-space:nowrap}

/* ---------------- PHOTO GRID + LIGHTBOX ---------------- */
.gallery-top{margin-bottom:24px}
.back{font-family:'Space Mono';font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);
  border:1px solid var(--line);background:var(--glass);padding:10px 15px;border-radius:10px;display:inline-flex;gap:8px}
.back:hover{color:var(--gold);border-color:var(--gold)}
.grid{columns:4 250px;column-gap:16px}
.grid .tile{break-inside:avoid;margin-bottom:16px;position:relative;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);background:var(--glass);cursor:pointer;display:block;width:100%;padding:0}
.grid .tile img{width:100%;height:auto;display:block;transition:.4s}
.grid .tile::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;
  box-shadow:inset 0 0 0 0 var(--gold);transition:.2s}
.grid .tile:hover img{transform:scale(1.05);filter:brightness(1.1)}
.grid .tile:hover::after{box-shadow:inset 0 0 0 2px var(--gold)}
.grid .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 13px 11px;font-family:'Space Mono';font-size:11px;
  letter-spacing:.5px;color:#fff;opacity:0;transition:.2s;background:linear-gradient(transparent,rgba(4,5,13,.9))}
.grid .tile:hover .cap{opacity:1}

.empty-state{border:1px dashed var(--gold-deep);border-radius:18px;padding:56px 32px;text-align:center;
  background:var(--glass);backdrop-filter:blur(6px)}
.empty-state .pixel{font-family:'Space Mono';color:var(--gold);font-size:13px;letter-spacing:2px;display:block;margin-bottom:14px}
.empty-state p{color:var(--ink-dim);max-width:56ch;margin:0 auto}
.empty-state code{background:rgba(8,12,28,.8);border:1px solid var(--line-2);padding:2px 8px;border-radius:6px;color:var(--gold-bri);font-size:14px;font-family:'Space Mono'}

.lb{position:fixed;inset:0;z-index:90;background:rgba(3,4,11,.94);backdrop-filter:blur(10px);display:none;
  align-items:center;justify-content:center;flex-direction:column}
.lb.open{display:flex}
.lb .stage{position:relative;max-width:92vw;max-height:80vh;border-radius:14px;overflow:hidden;
  border:1px solid var(--line-2);box-shadow:0 0 0 1px rgba(255,206,77,.15),0 40px 90px rgba(0,0,0,.7)}
.lb .stage img{max-width:92vw;max-height:80vh;width:auto;height:auto;display:block;background:#000}
.lb .cap{margin-top:18px;font-family:'Space Mono';color:var(--ink-dim);font-size:13px;letter-spacing:.5px;text-align:center;max-width:80vw}
.lb .counter{font-family:'Space Mono';font-size:11px;letter-spacing:2px;color:var(--gold);margin-top:9px}
.lb-btn{position:absolute;background:var(--glass-2);border:1px solid var(--line-2);color:var(--ink);
  width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;transition:.15s;backdrop-filter:blur(6px)}
.lb-btn:hover{border-color:var(--gold);color:var(--gold)}
.lb .prev{left:20px;top:50%;transform:translateY(-50%)}.lb .next{right:20px;top:50%;transform:translateY(-50%)}
.lb .close{top:20px;right:20px;width:48px;height:48px;font-size:20px;position:fixed}
@media(max-width:640px){.lb .prev{left:8px}.lb .next{right:8px}.lb-btn{width:46px;height:46px}}

/* ---------------- STORY ---------------- */
.story-hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line-2);margin-bottom:24px}
.story-hero img{width:100%;height:clamp(240px,44vw,500px);object-fit:cover;filter:brightness(.9) saturate(1.05)}
.story-hero .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(transparent 30%,rgba(4,5,13,.96));padding:38px}
.story-hero .tag{font-family:'Space Mono';font-size:12px;letter-spacing:3px;color:var(--plasma);text-transform:uppercase;margin-bottom:12px}
.story-hero .t{font-family:'Sora';font-weight:800;font-size:clamp(22px,4vw,44px);letter-spacing:-1px;
  color:var(--gold-bri);text-shadow:0 0 30px rgba(255,206,77,.4);line-height:1}
.chapter{max-width:780px;margin:0 auto}
.chapter h3{font-family:'Sora';font-weight:800;font-size:clamp(24px,3.8vw,40px);letter-spacing:-1px;
  color:var(--gold);margin:64px 0 16px;line-height:1.02}
.chapter .dl{font-family:'Space Mono';font-size:11px;letter-spacing:2px;color:var(--ink-mute);text-transform:uppercase;display:block;margin-bottom:6px}
.chapter p{font-size:18px;color:var(--ink-dim);line-height:1.8}
.chapter .twin{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:34px 0}
.chapter .twin img,.chapter .solo img{width:100%;border-radius:14px;border:1px solid var(--line-2);cursor:pointer}
.chapter .solo{margin:34px 0}
@media(max-width:640px){.chapter .twin{grid-template-columns:1fr}}
/* story chapters — alternating photo/text feature rows */
.cfeats{display:flex;flex-direction:column;gap:26px;max-width:1000px;margin:44px auto 0}
.cfeat{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:30px}
.cfeat.rev .cmedia{order:2}
.cfeat.rev .ctext{order:1}
.cmedia{display:flex;gap:10px}
.cmedia img{width:100%;border-radius:14px;border:1px solid var(--line-2);cursor:pointer;display:block;aspect-ratio:4/3;object-fit:cover}
.cmedia.ph{align-items:center;justify-content:center;aspect-ratio:4/3;border-radius:14px;border:1px dashed var(--line-2);
  font-family:'Space Mono';font-size:11px;letter-spacing:1.5px;color:var(--ink-mute)}
.ctext .dl{font-family:'Space Mono';font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:10px}
.ctext h3{font-family:'Sora';font-weight:800;font-size:clamp(20px,2.6vw,27px);letter-spacing:-.5px;margin:0 0 14px;color:var(--ink)}
.ctext p{font-size:16px;color:var(--ink-dim);line-height:1.75;margin:0}
@media(max-width:760px){
  .cfeat{grid-template-columns:1fr;padding:22px;gap:20px}
  .cfeat.rev .cmedia{order:1}.cfeat.rev .ctext{order:2}
}
.story-end{text-align:center;margin-top:56px}
.story-end .btn{margin-top:8px}
.battle-cry{text-align:center;font-family:'Sora';font-weight:800;font-size:clamp(20px,4.4vw,40px);letter-spacing:-1px;
  color:var(--gold);margin:74px auto;max-width:18ch;line-height:1.1;
  text-shadow:0 0 40px rgba(255,206,77,.45)}
.battle-cry small{display:block;font-family:'Space Mono';font-weight:400;font-size:12px;letter-spacing:3px;
  color:var(--plasma);margin-bottom:14px;text-shadow:none}

.poem{max-width:700px;margin:0 auto;background:var(--glass);border:1px solid var(--line-2);border-radius:20px;
  padding:clamp(30px,5vw,60px);position:relative;backdrop-filter:blur(8px);overflow:hidden}
.poem::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  box-shadow:inset 0 0 60px rgba(255,206,77,.08);border:1px solid rgba(255,206,77,.18)}
.poem .stanza{margin:0 0 26px;font-family:'Inter';font-weight:500;font-size:16px;line-height:2;color:var(--ink);
  letter-spacing:.3px;text-align:center}
.poem .stanza:last-child{margin-bottom:0;color:var(--gold-bri)}

/* ---------------- MEDIA ---------------- */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.vid{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--glass);backdrop-filter:blur(6px)}
.vid .frame{aspect-ratio:16/9;background:#000;position:relative}
.vid .frame iframe,.vid .frame video{width:100%;height:100%;border:0;display:block}
.vid .frame.empty{display:grid;place-items:center;color:var(--ink-mute);font-family:'Space Mono';font-size:11px;text-align:center;line-height:1.9;padding:20px;letter-spacing:1px}
.vid .lab{padding:16px 18px;font-family:'Sora';font-weight:600}
.vid .lab small{display:block;color:var(--ink-mute);font-weight:400;margin-top:4px;font-size:13px;font-family:'Inter'}

.audio-list{display:grid;gap:12px;max-width:780px}
.track{display:flex;align-items:center;gap:16px;background:var(--glass);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;transition:.18s;backdrop-filter:blur(6px)}
.track:hover{border-color:var(--gold-deep)}
.track .ico{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;
  background:rgba(8,12,28,.7);border:1px solid var(--line-2);color:var(--gold);font-size:18px}
.track .info{flex:1;min-width:0}
.track .info b{font-family:'Sora';font-weight:700;display:block}
.track .info span{color:var(--ink-mute);font-size:13px;font-family:'Space Mono'}
.track audio{height:36px}
.track .soon{font-family:'Space Mono';font-size:10px;letter-spacing:1px;color:var(--ink-mute)}

/* ---------------- CONTACT / FAQ ---------------- */
.panel-card{background:var(--glass);border:1px solid var(--line-2);border-radius:20px;padding:clamp(28px,4vw,46px);backdrop-filter:blur(8px)}
.faq-item{border-bottom:1px solid var(--line);padding:24px 0}
.faq-item:last-child{border-bottom:0}
.faq-item h4{margin:0 0 9px;font-family:'Sora';font-weight:700;font-size:18px;color:var(--gold-bri)}
.faq-item p{margin:0;color:var(--ink-dim)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
@media(max-width:880px){.split{grid-template-columns:1fr;gap:30px}}
.helper{font-family:'Space Mono';font-size:12px;color:var(--ink-mute);margin-top:16px;letter-spacing:.5px}
.helper code{color:var(--gold-bri)}

/* ---------------- ENEMIES (photo-left / text-right feature rows) ---------------- */
.efeats{display:flex;flex-direction:column;gap:28px}
.efeat{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:38px;align-items:center;
  background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:24px;backdrop-filter:blur(6px);transition:.25s}
.efeat:hover{border-color:var(--line-2);box-shadow:0 22px 54px rgba(0,0,0,.45)}
.escan{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#06070f;
  border:1px solid var(--line-2);display:grid;place-items:center;box-shadow:inset 0 0 70px rgba(0,0,0,.7)}
.escan::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 30%,transparent 55%,rgba(0,0,0,.5))}
.escan img{width:100%;height:100%;object-fit:contain;background:#03040a}
.escore.ally{background:rgba(84,217,255,.12);border-color:rgba(84,217,255,.4);color:var(--plasma)}
/* schematics */
.sec-head{align-items:flex-start}
.schzip{white-space:nowrap;margin-top:6px}
.schgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;margin-top:14px}
@media(max-width:720px){.schgrid{grid-template-columns:1fr}}
.schcard{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.schcover{position:relative;border:0;padding:0;cursor:pointer;background:#0a0c16;display:block;aspect-ratio:4/3;overflow:hidden}
.schcover img{width:100%;height:100%;object-fit:cover;object-position:top;opacity:.92;transition:.4s}
.schcover:hover img{opacity:1;transform:scale(1.03)}
.schview{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 12px;font-family:'Space Mono';font-size:12px;letter-spacing:1px;color:var(--gold);
  background:linear-gradient(180deg,transparent,rgba(4,5,13,.9))}
.schmeta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.schmeta h3{font-family:'Sora';font-size:22px;margin:0}
.schnote{font-family:'Space Mono';font-size:11px;letter-spacing:1px;color:var(--ink-dim);text-transform:uppercase}
.schbtns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pdfmodal{position:fixed;inset:0;z-index:200;background:rgba(2,3,10,.93);backdrop-filter:blur(7px);display:flex;flex-direction:column;padding:14px;animation:fade .2s ease}
.pdfbar{display:flex;gap:12px;align-items:center;justify-content:flex-end;padding:4px 2px 12px}
.pdftitle{margin-right:auto;font-family:'Space Mono';font-size:13px;letter-spacing:1px;color:var(--gold)}
.pdfmodal iframe{flex:1;width:100%;border:0;border-radius:12px;background:#525659}
.pdfx{cursor:pointer;font-family:'Space Mono';font-size:12px;letter-spacing:1px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:9px 14px}
.pdfx:hover{background:rgba(255,255,255,.15)}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* ET alien emblem + sprinkle */
.et-sig{display:flex;justify-content:center;flex-shrink:0}
.f .sig{margin-top:8px}
.fnav{max-width:var(--maxw);margin:0 auto;padding:26px 26px 0;display:flex;flex-wrap:wrap;
  justify-content:center;gap:6px 4px;border-bottom:1px solid var(--line);padding-bottom:22px}
.fnav a{font-family:'Space Mono';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink-mute);padding:7px 14px;border-radius:20px;transition:.2s}
.fnav a:hover{color:var(--gold);background:rgba(255,206,77,.08)}
@media(max-width:640px){.fnav{gap:4px 2px}.fnav a{padding:6px 10px;font-size:10px}}
.et-emblem{width:132px;height:132px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.5))}
.et-emblem .et-stars circle{animation:ettwinkle 2.8s ease-in-out infinite}
.et-emblem .et-stars circle:nth-child(2){animation-delay:.4s}
.et-emblem .et-stars circle:nth-child(3){animation-delay:.9s}
.et-emblem .et-stars circle:nth-child(4){animation-delay:1.4s}
.et-emblem .et-stars circle:nth-child(5){animation-delay:.7s}
.et-emblem .et-stars circle:nth-child(6){animation-delay:1.1s}
.et-emblem .et-face{animation:etaura 3s ease-in-out infinite}
@keyframes ettwinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes etaura{0%,100%{filter:drop-shadow(0 0 2px rgba(91,255,134,.25))}50%{filter:drop-shadow(0 0 7px rgba(91,255,134,.7))}}
#et-sprinkle{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.etmark-fx{position:fixed;opacity:.15;animation:etbob 6s ease-in-out infinite}
.etmark-fx svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 5px rgba(91,255,134,.35))}
@keyframes etbob{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-12px) rotate(var(--rot,0deg))}}
@media(prefers-reduced-motion:reduce){.et-emblem .et-stars circle,.et-emblem .et-face,.etmark-fx{animation:none!important}}
.escan svg{width:56%;height:56%;color:var(--gold);filter:drop-shadow(0 0 16px rgba(255,206,77,.5));position:relative;z-index:1}
.escan svg [fill]{fill:none}
.escan svg path,.escan svg circle,.escan svg rect,.escan svg line,.escan svg polygon{
  stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.escan .elines{position:absolute;inset:0;pointer-events:none;opacity:.45;z-index:2;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.4) 2px 4px)}
.escan .etag{position:absolute;left:12px;top:12px;z-index:3;font-family:'Space Mono';font-size:10px;letter-spacing:1px;
  color:var(--plasma);background:rgba(4,5,13,.62);border:1px solid var(--line-2);padding:4px 8px;border-radius:7px}
.einfo h3{font-family:'Sora';font-weight:800;font-size:clamp(28px,4vw,46px);letter-spacing:-1px;line-height:1;
  color:var(--gold);text-shadow:0 0 30px rgba(255,206,77,.26);margin:8px 0 14px;text-transform:uppercase}
.emeta{display:flex;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.ethreat{font-family:'Space Mono';font-size:11px;letter-spacing:1.5px;color:var(--ink-dim);
  display:inline-flex;align-items:center;gap:7px;text-transform:uppercase}
.ethreat i{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:inline-block}
.ethreat i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.escore{font-family:'Space Mono';font-size:12px;letter-spacing:1px;color:var(--gold);
  border:1px solid var(--gold-deep);border-radius:20px;padding:5px 13px}
.einfo p{font-size:17px;color:var(--ink-dim);line-height:1.75;margin:0}
@media(max-width:760px){.efeat{grid-template-columns:1fr;gap:20px}}

/* ---------------- FOOTER ---------------- */
footer{border-top:1px solid var(--line);background:rgba(7,10,24,.6);margin-top:30px;position:relative;z-index:5;backdrop-filter:blur(8px)}
.f{max-width:var(--maxw);margin:0 auto;padding:44px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.f .left{font-family:'Space Mono';font-size:12px;letter-spacing:1px;color:var(--ink-mute);line-height:2}
.f .sig{font-family:'Space Mono';font-size:12px;letter-spacing:2px;color:var(--gold);display:inline-flex;align-items:center;gap:9px}
.f .sig::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
@media (prefers-reduced-motion: no-preference){.f .sig::before{animation:pulse2 1.6s ease-in-out infinite}}
@keyframes pulse2{50%{opacity:.3}}

      desc:"Mutant \u2013 This guy used to be human, but now he\u2019s all about that wild life. With a personality that screams \u2018anger management needed.\u2019 He zig-zags around like he's trying to avoid responsibilities, but all he\u2019s really doing is trying to ruin your day, one erratic move at a time. He\u2019s a ball of rage with questionable life choices, flying around like he\u2019s late for his shift at the space 7-Eleven. Remember that guy in high school who peaked in gym class and now lives in his mom\u2019s basement? That\u2019s the Mutant. Once a regular guy, now it\u2019s more like \u2018space Karen.\u2019 Always darting around like he's trying to find the manager of the galaxy, and trust me, he's not here to leave a good review. He sporadically flies around like he's late for yoga, but don't be fooled\u2014this dude\u2019s got anger issues and zero chill." },

      desc:"Baiter \u2013 The Baiter has one setting: hyper-annoying. Think of a mosquito that drank an entire energy drink. It\u2019s fast, it\u2019s annoying, and it\u2019s always there when you just thought you were doing well. He's the universe\u2019s ultimate troll. Imagine if a fly went to space, had a double shot of espresso, and then decided to major in being the worst. The Baiter\u2019s like that friend who never gets the hint to leave the party. Shows up unannounced, speeds around like it\u2019s on a sugar rush, and is really good at making you question your life choices. He's always right there when you\u2019re just starting to feel good about yourself. Think of it as the universe\u2019s way of saying, \u2018Not so fast, champ.\u2019 The Baiter\u2019s sole purpose is to show up when you\u2019re winning and make you cry inside." },

      desc:"Bomber \u2013 Slow, steady, and\u2026 plotting? It\u2019s the galaxy\u2019s laziest terrorist. Moving at the speed of molasses but somehow still dangerous. It's too slow to chase you but perfectly happy to ruin your day with bombs. The Bomber is the space equivalent of a turtle with a grudge. It\u2019s not fast, but deliberate, and leaving a trail of destruction behind him, laying mines like it's planting an evil space garden. Get too close, and BOOM\u2014instant regret! The Bomber is like that one grandpa who insists on doing things his way\u2014slow and steady\u2014but instead of Werther\u2019s Originals, he\u2019s dropping bombs like they\u2019re going out of style. Silent, but deadly." },

      desc:"Pod \u2013 Oh, look, a space egg! Crack it open, out pop 500 angry Swarmers. Pods are like the mystery prize in a cereal box, except instead of a toy, you get an angry mob of Swarmers. It\u2019s basically the galaxy's mine field, one hit and boom, it\u2019s raining disappointment. It\u2019s the cosmic version of a clown car, break it open and out come a dozen little space gremlins. Except instead of juggling or telling jokes, they just swarm you and ruin your hopes and dreams. It\u2019s the cosmic version of opening Pandora\u2019s box, only louder. Pods are like the pi\u00f1atas of space...except instead of candy, they explode into Swarmers. Smack one open, and you\u2019ll wish you had just left it alone. The ultimate \u2018surprise, you lose!\u2019 enemy." },

      desc:"Swarmer \u2013 If you thought one was bad, wait until you meet its 50 closest relatives. The galaxy's biggest family reunion, and you weren't invited! Tiny, relentless, and always traveling in packs. It\u2019s like someone spilled a box of angry space marbles and forgot to clean up. They might be small, but they have the power to ruin your day and your ship. Swarmers are like space bees... miniature, pesky, and determined to sting you right out of the sky. Alien version of ants at a picnic, they show up uninvited in packs, have no respect for personal space, and basically turn your ship into their personal 'rage room.' Individually they\u2019re harmless, but together they're obnoxious, and always more of them than you can handle. Good luck swatting these space gnats!" },

 {h:"At first, scientists thought it was just another meteorite…", p:"But as they studied it, they realized it was something much more extraordinary: an ancient arcade game from 1981, called Golden Defender. Baffled and desperately wanting to make sense of it, they powered it up. The game had a unique glow, its gold lights flickering and its rusty old speakers crackling to life. A strange energy began to emanate from the machine, and soon scientists across the globe noticed it was drawing aliens from across the galaxy to our planet. These creatures — Mutants, Baiters, Landers, Swarmers, Pods, and Bombers — had traveled the vast expanse of space to conquer Earth and harness the power of the Legendary Golden Defender.", imgs:["AA5AbUAThEBgr7Tbkl9FoPFvBRZZ4PUl10pqCoo7cxGycnx5PTRnC2XCF2dWSO9dQxCJghW2GjJ8RC5PwL_MGHTqWDjUyjDlNnGmK3a6DZTd6c7fW2n9hsmGL9sFjZXMPOcuFJnyyRFslcIsWIqZmZwSE3xRdwM9rvhtURfQQDpusiDuYB1GNYKmvVgZxUAZjeNTeODWp6HgwdCpQyHEmQIYaIudIICjrFKbQaC1BM0Xrkg","AA5AbUBlBVqJxMyj3rQfoDxyayMzdqKWk4dkaqFKG49pOwk429xpj9dGwgeLTpVsY_MJLNCyZ-i-iI2pozeZskcE7UR1bFFBPTPSuCCtNefZGXUpp8iO8j7zTvwIAEw8E9MiAUHKnA1wGrOKFZ2psmZpgzsYPmNxgY6vSZM6wGw4dYxAWBgUA4edkZRsDGcfSw_GG1nwB9tYdwlE3K7Gn2VAeTTgG5YJr_tDsWKzNflxdZ0"]},

<script>
/* ============ boot ============ */
document.getElementById('yr').textContent=new Date().getFullYear();
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');

/* ============ STARFIELD ============ */
(function spacefield(){
  const c=$('#stars'),x=c.getContext('2d');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,dpr,t=0,stars=[],dust=[],shoots=[],comets=[],novas=[],bh=null;
  const rnd=(a,b)=>a+Math.random()*(b-a);

  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    w=c.width=innerWidth*dpr; h=c.height=innerHeight*dpr;
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    const n=Math.round(innerWidth*innerHeight/6500);
    stars=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,
      r:(Math.random()*1.3+.3)*dpr,a:Math.random()*.6+.25,tw:Math.random()*6.28,sp:Math.random()*.5+.15}));
    dust=Array.from({length:Math.round(n/9)},()=>({x:Math.random()*w,y:Math.random()*h,
      r:(Math.random()*1.6+.8)*dpr,a:Math.random()*.5+.2,tw:Math.random()*6.28}));
    // black hole — distant, upper-right, with golden accretion disk
    const R=Math.max(20*dpr,Math.min(54*dpr,Math.min(w,h)*0.05));
    bh={x:w*0.85,y:h*0.19,R,rot:0,
      parts:Array.from({length:46},()=>({ang:Math.random()*6.28,rad:rnd(R*1.35,R*5.2),
        sp:rnd(.005,.015),vr:rnd(.07,.22)*dpr}))};
  }

  function drawBlackHole(){
    const {x:bx,y:by,R}=bh;
    // outer gravitational glow
    let g=x.createRadialGradient(bx,by,R*0.8,bx,by,R*6);
    g.addColorStop(0,'rgba(255,180,70,.10)');g.addColorStop(.5,'rgba(150,130,255,.05)');g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.beginPath();x.arc(bx,by,R*6,0,6.2832);x.fill();
    // infalling matter (spiraling particles)
    x.globalCompositeOperation='lighter';
    for(const p of bh.parts){
      if(!reduce){ p.ang+=p.sp*(1+ (R*2/p.rad)); p.rad-=p.vr*(R/p.rad); }
      if(p.rad<R*1.12){ p.rad=rnd(R*4.4,R*5.4); p.ang=Math.random()*6.28; }
      const px=bx+Math.cos(p.ang)*p.rad, py=by+Math.sin(p.ang)*p.rad*0.42; // flattened disk
      const heat=Math.max(0,Math.min(1,(R*5-p.rad)/(R*4)));
      const col=`rgba(255,${Math.round(150+95*heat)},${Math.round(40+30*(1-heat))},${.5+.5*heat})`;
      x.fillStyle=col;x.beginPath();x.arc(px,py,(.8+1.4*heat)*dpr,0,6.2832);x.fill();
    }
    // accretion disk — multi-band, Saturn-style rings with subtle color variation
    x.save();x.translate(bx,by);if(!reduce)bh.rot+=0.006;x.rotate(bh.rot);x.scale(1,0.4);
    const bands=[
      {rr:1.32,w:1.6,hue:'255,224,150',peak:.5},   // warm gold — innermost
      {rr:1.62,w:2.6,hue:'255,236,190',peak:.85},  // bright cream — main ring
      {rr:1.98,w:1.4,hue:'190,215,255',peak:.4},   // pale blue band
      {rr:2.3, w:1.1,hue:'255,190,210',peak:.32},  // faint rose band
      {rr:2.6, w:0.9,hue:'255,206,120',peak:.24},  // thin outer gold
    ];
    for(const b of bands){
      const rr=R*b.rr;
      const lg=x.createLinearGradient(-rr,0,rr,0);
      lg.addColorStop(0,`rgba(${b.hue},0)`);lg.addColorStop(.35,`rgba(${b.hue},${b.peak*0.55})`);
      lg.addColorStop(.5,`rgba(${b.hue},${b.peak})`);lg.addColorStop(.65,`rgba(${b.hue},${b.peak*0.55})`);lg.addColorStop(1,`rgba(${b.hue},0)`);
      x.strokeStyle=lg;x.lineWidth=b.w*dpr;x.beginPath();x.arc(0,0,rr,0,6.2832);x.stroke();
    }
    x.restore();
    x.globalCompositeOperation='source-over';
    // photon ring (bright thin halo)
    x.strokeStyle='rgba(255,240,200,.85)';x.lineWidth=1.4*dpr;
    x.beginPath();x.arc(bx,by,R*1.04,0,6.2832);x.stroke();
    // event horizon (the void)
    const eg=x.createRadialGradient(bx,by,R*0.2,bx,by,R);
    eg.addColorStop(0,'#000');eg.addColorStop(.82,'#000');eg.addColorStop(1,'rgba(0,0,0,.2)');
    x.fillStyle=eg;x.beginPath();x.arc(bx,by,R,0,6.2832);x.fill();
  }

  function spawnShoot(){
    const fromLeft=Math.random()<.5;
    const sp=rnd(3.4,5.6)*dpr, ang=rnd(0.25,0.6)*(fromLeft?1:-1)+(fromLeft?0:Math.PI);
    shoots.push({x:fromLeft?rnd(0,w*.5):rnd(w*.5,w),y:rnd(0,h*.45),
      vx:Math.cos(ang)*sp,vy:Math.abs(Math.sin(ang))*sp,life:0,max:rnd(80,120),
      len:rnd(120,210)*dpr});
  }
  function drawShoots(){
    for(let i=shoots.length-1;i>=0;i--){
      const s=shoots[i];s.life++;s.x+=s.vx;s.y+=s.vy;
      const a=Math.max(0,1-s.life/s.max), L=s.len, ux=s.vx, uy=s.vy, m=Math.hypot(ux,uy);
      const tx=s.x-ux/m*L, ty=s.y-uy/m*L;
      const g=x.createLinearGradient(s.x,s.y,tx,ty);
      g.addColorStop(0,`rgba(255,244,200,${a})`);g.addColorStop(1,'rgba(255,244,200,0)');
      x.globalCompositeOperation='lighter';
      x.strokeStyle=g;x.lineWidth=1.7*dpr;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(tx,ty);x.stroke();
      x.globalCompositeOperation='source-over';
      if(s.life>s.max||s.x<-L||s.x>w+L||s.y>h+L)shoots.splice(i,1);
    }
  }

  function spawnComet(){
    const fromLeft=Math.random()<.5, sp=rnd(2.2,3.0)*dpr;
    const ang=rnd(0.10,0.30)*(fromLeft?1:-1);
    comets.push({x:fromLeft?-90*dpr:w+90*dpr, y:rnd(h*.08,h*.5),
      vx:(fromLeft?1:-1)*sp*Math.cos(ang), vy:sp*Math.sin(ang)+0.32*dpr,
      len:rnd(160,250)*dpr, wd:rnd(3.4,5.4)*dpr, bend:rnd(-1,1)*9*dpr, life:0});
  }
  // smooth tapered tail (teardrop) with a gentle curve, filled by a gradient
  function tail(Hx,Hy,Tx,Ty,pxp,pyp,wHalf,cx,cy,stops){
    const g=x.createLinearGradient(Hx,Hy,Tx,Ty);
    for(const s of stops)g.addColorStop(s[0],s[1]);
    x.fillStyle=g;x.beginPath();
    x.moveTo(Hx+pxp*wHalf,Hy+pyp*wHalf);
    x.quadraticCurveTo(cx+pxp*wHalf*0.6,cy+pyp*wHalf*0.6,Tx,Ty);
    x.quadraticCurveTo(cx-pxp*wHalf*0.6,cy-pyp*wHalf*0.6,Hx-pxp*wHalf,Hy-pyp*wHalf);
    x.closePath();x.fill();
  }
  function drawComets(){
    for(let i=comets.length-1;i>=0;i--){
      const cm=comets[i];cm.life++;cm.x+=cm.vx;cm.y+=cm.vy;
      const m=Math.hypot(cm.vx,cm.vy),ux=cm.vx/m,uy=cm.vy/m,pxp=-uy,pyp=ux;
      const Hx=cm.x,Hy=cm.y,L=cm.len,w0=cm.wd;
      const cax=Hx-ux*L*0.5, cay=Hy-uy*L*0.5;
      x.globalCompositeOperation='lighter';
      // broad diffuse dust tail: white-gold near head fading to red at the tip
      tail(Hx,Hy,Hx-ux*L,Hy-uy*L,pxp,pyp,w0*2.4,cax+pxp*cm.bend,cay+pyp*cm.bend,
        [[0,'rgba(255,242,214,.55)'],[.28,'rgba(255,184,96,.34)'],[.62,'rgba(255,96,44,.18)'],[1,'rgba(255,60,30,0)']]);
      // bright inner streak (hot core)
      tail(Hx,Hy,Hx-ux*L*0.72,Hy-uy*L*0.72,pxp,pyp,w0*0.85,cax+pxp*cm.bend*.6,cay+pyp*cm.bend*.6,
        [[0,'rgba(255,255,250,.95)'],[.45,'rgba(255,228,176,.55)'],[1,'rgba(255,180,110,0)']]);
      // glowing head (coma)
      const hg=x.createRadialGradient(Hx,Hy,0,Hx,Hy,w0*3.2);
      hg.addColorStop(0,'rgba(255,255,252,1)');hg.addColorStop(.35,'rgba(255,238,200,.85)');hg.addColorStop(1,'rgba(255,200,120,0)');
      x.fillStyle=hg;x.beginPath();x.arc(Hx,Hy,w0*3.2,0,6.2832);x.fill();
      x.globalCompositeOperation='source-over';
      if(cm.x<-180*dpr||cm.x>w+180*dpr||cm.y>h+180*dpr)comets.splice(i,1);
    }
  }

  function spawnNova(){
    const cx=rnd(w*.14,w*.86), cy=rnd(h*.1,h*.62);
    const ej=Array.from({length:46},()=>{const a=Math.random()*6.2832;
      return{ux:Math.cos(a),uy:Math.sin(a),r:rnd(.6,1.9)*dpr,off:rnd(.5,1.12)};});
    novas.push({x:cx,y:cy,life:0,max:175,maxR:rnd(150,240)*dpr,ej});
  }
  function drawNovas(){
    for(let i=novas.length-1;i>=0;i--){
      const nv=novas[i];nv.life++;const p=nv.life/nv.max;
      x.globalCompositeOperation='lighter';
      // 1) flash bloom — brilliant, fast rise then fade
      const flash=p<.1?(p/.1):Math.max(0,1-(p-.1)/.42);
      if(flash>0){
        const fr=nv.maxR*(0.5+0.5*Math.min(1,p/.1));
        const fg=x.createRadialGradient(nv.x,nv.y,0,nv.x,nv.y,fr);
        fg.addColorStop(0,`rgba(255,255,255,${flash})`);
        fg.addColorStop(.22,`rgba(220,236,255,${flash*.85})`);
        fg.addColorStop(.55,`rgba(255,226,150,${flash*.42})`);
        fg.addColorStop(1,'rgba(255,180,90,0)');
        x.fillStyle=fg;x.beginPath();x.arc(nv.x,nv.y,fr,0,6.2832);x.fill();
        // soft star-flare cross at the brightest moment
        if(p<.2){const fa=(1-p/.2)*0.55,FL=nv.maxR*1.35;
          for(let k=0;k<2;k++){const ax=k?FL:0,ay=k?0:FL;
            const lg=x.createLinearGradient(nv.x-ax,nv.y-ay,nv.x+ax,nv.y+ay);
            lg.addColorStop(0,'rgba(255,246,222,0)');lg.addColorStop(.5,`rgba(255,246,222,${fa})`);lg.addColorStop(1,'rgba(255,246,222,0)');
            x.strokeStyle=lg;x.lineWidth=1.5*dpr;x.beginPath();x.moveTo(nv.x-ax,nv.y-ay);x.lineTo(nv.x+ax,nv.y+ay);x.stroke();}}
      }
      // 2) expanding luminous shell — soft thick blast wave, blue-white edge over warm interior
      const e=1-Math.pow(1-p,2.2), R=nv.maxR*e;
      if(R>2){
        const sa=Math.max(0,1-p)*0.95;
        const sg=x.createRadialGradient(nv.x,nv.y,R*0.5,nv.x,nv.y,R*1.05);
        sg.addColorStop(0,'rgba(255,150,60,0)');
        sg.addColorStop(.72,`rgba(255,168,72,${sa*.16})`);
        sg.addColorStop(.9,`rgba(255,212,132,${sa*.55})`);
        sg.addColorStop(.985,`rgba(196,224,255,${sa*.5})`);
        sg.addColorStop(1,'rgba(196,224,255,0)');
        x.fillStyle=sg;x.beginPath();x.arc(nv.x,nv.y,R*1.05,0,6.2832);x.fill();
      }
      // 3) ejecta debris streaking outward
      const ea=Math.max(0,1-p*1.05);
      if(ea>0) for(const d of nv.ej){
        const dist=e*nv.maxR*d.off;
        const dx=nv.x+d.ux*dist, dy=nv.y+d.uy*dist;
        const sx=nv.x+d.ux*dist*0.85, sy=nv.y+d.uy*dist*0.85;
        const tg=x.createLinearGradient(sx,sy,dx,dy);
        tg.addColorStop(0,'rgba(255,200,120,0)');tg.addColorStop(1,`rgba(255,232,184,${ea})`);
        x.strokeStyle=tg;x.lineWidth=d.r;x.beginPath();x.moveTo(sx,sy);x.lineTo(dx,dy);x.stroke();
        x.fillStyle=`rgba(255,240,210,${ea})`;x.beginPath();x.arc(dx,dy,d.r,0,6.2832);x.fill();
      }
      // 4) lingering remnant glow, fading
      if(p>.4){const ra=(1-p)*0.26;
        const ng=x.createRadialGradient(nv.x,nv.y,0,nv.x,nv.y,nv.maxR*0.8);
        ng.addColorStop(0,`rgba(150,180,255,${ra})`);ng.addColorStop(1,'rgba(150,180,255,0)');
        x.fillStyle=ng;x.beginPath();x.arc(nv.x,nv.y,nv.maxR*0.8,0,6.2832);x.fill();}
      x.globalCompositeOperation='source-over';
      if(nv.life>nv.max)novas.splice(i,1);
    }
  }

  function frame(){
    x.clearRect(0,0,w,h);
    for(const s of stars){
      const tw=reduce?1:(.6+.4*Math.sin(s.tw+t*.04*s.sp));
      x.globalAlpha=s.a*tw;x.fillStyle='#dfe6ff';
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.2832);x.fill();
      if(!reduce){s.y+=s.sp*.12*dpr;if(s.y>h){s.y=0;s.x=Math.random()*w;}}
    }
    for(const d of dust){
      const tw=reduce?1:(.5+.5*Math.sin(d.tw+t*.05));
      x.globalAlpha=d.a*tw;x.fillStyle='#ffd66a';
      x.beginPath();x.arc(d.x,d.y,d.r,0,6.2832);x.fill();
    }
    x.globalAlpha=1;
    drawBlackHole();
    if(!reduce){
      // multiple shooting stars, more frequent
      if(shoots.length<4 && Math.random()<.022) spawnShoot();
      drawShoots();
      // flaming comet — rarer, at most one
      if(comets.length===0 && Math.random()<.0022) spawnComet();
      drawComets();
      // supernova — occasional
      if(novas.length===0 && Math.random()<.0016) spawnNova();
      drawNovas();
    }
    x.globalAlpha=1;t++;
    if(!reduce)requestAnimationFrame(frame);
  }
  size();frame();
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{size();if(reduce)frame();},200)});
})();

function radarBlips(){
  const pts=[[30,38],[68,30],[58,64],[40,72],[74,58],[24,58]];
  return pts.map((p,i)=>`<span class="blip" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${i*.35}s"></span>`).join('');
}
function terrainPath(){
  let d='M0,40'; let x=0; const seg=7;
  for(let i=0;i<=seg;i++){ x=i*(1000/seg); const y=10+Math.round(Math.random()*40); d+=` L${x},${y}`; }
  return d;
}

let LB={list:[],i:0};
function srcList(key){ return key==='schematics'?SITE.schematics.photos:((SITE.galleries[key]||{}).photos||[]); }
function openLightbox(key,i){ LB.list=srcList(key); LB.i=i; showLB(); }
function openSolo(src,cap){ LB.list=[{src,cap}]; LB.i=0; showLB(); }
function showLB(){
  const p=LB.list[LB.i]; if(!p) return;
  $('#lbImg').src=p.src; $('#lbImg').alt=p.cap||'';
  $('#lbCap').textContent=p.cap||'';
  $('#lbCount').textContent=LB.list.length>1?`${pad(LB.i+1)} / ${pad(LB.list.length)}`:'';
  const multi=LB.list.length>1;
  $('#lbPrev').style.display=multi?'grid':'none';
  $('#lbNext').style.display=multi?'grid':'none';
  $('#lightbox').classList.add('open'); document.body.style.overflow='hidden';
}
function closeLB(){ $('#lightbox').classList.remove('open'); document.body.style.overflow=''; }
function step(d){ LB.i=(LB.i+d+LB.list.length)%LB.list.length; showLB(); }
$('#lbClose').addEventListener('click',closeLB);
$('#lbPrev').addEventListener('click',()=>step(-1));
$('#lbNext').addEventListener('click',()=>step(1));
$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLB();});
addEventListener('keydown',e=>{
  if(!$('#lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='ArrowRight')step(1);
});
let tx=0;
$('#lightbox').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#lightbox').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50&&LB.list.length>1)step(dx<0?1:-1);});

render();

/* ---- animated favicon: pulsing ringed golden planet ---- */
(function(){
  var link=document.getElementById('favicon'); if(!link) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S=48, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
  var x=cv.getContext('2d'), c=S/2, R=S/2-2;
  var pr=S*0.24, rx=S*0.44, ry=S*0.15, t=0;
  function ell(cx,cy,ax,ay,a0,a1){ x.beginPath(); x.ellipse(cx,cy,ax,ay,0,a0,a1); }
  function draw(){
    var s=0.5+0.5*Math.sin(t*2*Math.PI);          // 0..1 pulse
    x.clearRect(0,0,S,S);
    // space disc (fades to transparent at edge)
    var bg=x.createRadialGradient(c,c,0,c,c,R);
    bg.addColorStop(0,'rgba(9,12,22,.82)'); bg.addColorStop(1,'rgba(9,12,22,0)');
    ell(c,c,R,R,0,7); x.fillStyle=bg; x.fill();
    // expanding ripple ring (emanates + fades)
    var rp=t%1, rs=1+0.9*rp;
    x.strokeStyle='rgba(255,206,77,'+(0.42*(1-rp))+')'; x.lineWidth=1.4;
    ell(c,c,rx*rs,ry*rs,0,7); x.stroke();
    // ring behind (breathes + brightens with pulse)
    var rk=1+0.07*s, ra=0.5+0.4*s;
    x.strokeStyle='rgba(255,206,77,'+ra+')'; x.lineWidth=2.4;
    ell(c,c,rx*rk,ry*rk,0,7); x.stroke();
    x.strokeStyle='rgba(255,236,150,'+(0.35*s)+')'; x.lineWidth=1.1;
    ell(c,c,rx*0.82*rk,ry*0.82*rk,0,7); x.stroke();
    // glow behind planet (pulses)
    var gr=pr*(1.35+0.7*s);
    var gg=x.createRadialGradient(c,c,pr*0.6,c,c,gr);
    gg.addColorStop(0,'rgba(255,206,77,'+(0.30+0.30*s)+')'); gg.addColorStop(1,'rgba(255,206,77,0)');
    ell(c,c,gr,gr,0,7); x.fillStyle=gg; x.fill();
    // planet sphere (radial w/ offset highlight), gentle breathe
    var pk=pr*(1+0.05*s), hx=c-pk*0.34, hy=c-pk*0.34;
    var pg=x.createRadialGradient(hx,hy,0,c,c,pk);
    pg.addColorStop(0,'#fff3c8'); pg.addColorStop(0.45,'#ffce4d'); pg.addColorStop(1,'#9c6a17');
    ell(c,c,pk,pk,0,7); x.fillStyle=pg; x.fill();
    // specular dot
    ell(hx,hy,pk*0.16,pk*0.16,0,7); x.fillStyle='rgba(255,252,235,.85)'; x.fill();
    // ring front (bottom half) over planet
    x.strokeStyle='rgba(255,214,96,'+ra+')'; x.lineWidth=2.6;
    ell(c,c,rx*rk,ry*rk,0,Math.PI); x.stroke();
    try{ link.href=cv.toDataURL('image/png'); }catch(e){}
  }
  draw();
  if(!reduce){ setInterval(function(){ t=(t+0.02)%1000; draw(); }, 70); }
})();

/* ---- sprinkle ET aliens in random spots (desktop) ---- */
(function(){
  if (window.innerWidth < 900) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a,b){return a+Math.random()*(b-a);}
  function sprinkle(){
    var old=document.getElementById('et-sprinkle'); if(old) old.remove();
    var wrap=document.createElement('div'); wrap.id='et-sprinkle';
    var n=5;
    for(var i=0;i<n;i++){
      var s=document.createElement('div'); s.className='etmark-fx';
      var right=Math.random()<0.5;
      var lane=right?rnd(92,97.5):rnd(1.5,6);        // hug left/right margins
      s.style.left=lane+'vw';
      s.style.top=rnd(12,84)+'vh';
      s.style.width=rnd(24,44).toFixed(0)+'px';
      s.style.setProperty('--rot',(rnd(-16,16)|0)+'deg');
      if(!reduce) s.style.animationDelay=rnd(0,4).toFixed(2)+'s';
      s.innerHTML='<svg viewBox="0 0 120 150"><use href="#sym-alien"/></svg>';
      wrap.appendChild(s);
    }
    document.body.appendChild(wrap);
  }
  sprinkle();
  window.addEventListener('hashchange', sprinkle);   // re-scatter as you browse
})();
