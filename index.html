<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Cabinet Photo Set — 38–57</title>
<style>
  :root {
    --bg: #14120f;
    --panel: #1e1b17;
    --gold: #d4af37;
    --gold-soft: #b8944a;
    --text: #f0e9dc;
    --text-dim: #a89f8f;
    --border: #3a342a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 40px;
    text-align: center;
  }
  header h1 {
    font-size: 2rem;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #e8c667, #c0392b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 28px;
  }
  figure {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  figure img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    background: #000;
  }
  figcaption {
    padding: 14px 16px;
    font-size: 0.92rem;
    line-height: 1.4;
    color: var(--text);
    border-top: 2px solid var(--gold-soft);
  }
  figcaption .num {
    display: inline-block;
    color: var(--gold);
    font-weight: 700;
    margin-right: 6px;
  }
  footer {
    max-width: 1100px;
    margin: 40px auto 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>Golden Defender &amp; Cabinet Lineup</h1>
  <p>Photo set — images 38 through 57</p>
</header>

<div class="grid">

  <figure>
    <img src="images/38-detail-shot-golden-defender.jpg" alt="Golden Defender control panel top-down">
    <figcaption><span class="num">38.</span>Top-down view of the Golden Defender's control panel, showing the Williams badge, twin buttons, cabinet key, and "Golden Defender 500,001" ID plaque</figcaption>
  </figure>

  <figure>
    <img src="images/39-detail-shot-golden-defender.jpg" alt="Underside of marquee and speaker area">
    <figcaption><span class="num">39.</span>Looking up into the underside of the marquee/speaker area, gold-speckled paint finish visible against the black speaker mesh</figcaption>
  </figure>

  <figure>
    <img src="images/40-detail-shot-golden-defender.jpg" alt="Speaker grille below marquee">
    <figcaption><span class="num">40.</span>Front-on shot of the speaker grille below the marquee, with the "Defender" instruction card visible on the control deck</figcaption>
  </figure>

  <figure>
    <img src="images/41-detail-shot-golden-defender.jpg" alt="Four cabinets lit on attract screens">
    <figcaption><span class="num">41.</span>Wide shot of all four cabinets lit up — Defender (gold), Defender (black), Stargate, and Robotron: 2084 — each on their attract screen</figcaption>
  </figure>

  <figure>
    <img src="images/42-detail-shot-golden-defender.jpg" alt="Four cabinets showing different screens">
    <figcaption><span class="num">42.</span>Same four-cabinet lineup, screens now showing Hall of Fame, Scanner, Stargate profile view, and the Robotron intro</figcaption>
  </figure>

  <figure>
    <img src="images/43-detail-shot-golden-defender.jpg" alt="Angled view of coin doors and keys">
    <figcaption><span class="num">43.</span>Angled view of the four-cabinet row showing the coin doors and hanging keys along the base</figcaption>
  </figure>

  <figure>
    <img src="images/44-detail-shot-golden-defender.jpg" alt="Closer angled view of four cabinets">
    <figcaption><span class="num">44.</span>Closer angled perspective of the same four cabinets, highlighting the side panels and cabinet joinery</figcaption>
  </figure>

  <figure>
    <img src="images/45-detail-shot-golden-defender.jpg" alt="Full room wide shot of four cabinets">
    <figcaption><span class="num">45.</span>Full-room wide shot of the four-cabinet lineup from a slightly different standing position</figcaption>
  </figure>

  <figure>
    <img src="images/46-detail-shot-golden-defender.jpg" alt="Three cabinets straight on">
    <figcaption><span class="num">46.</span>Straight-on shot of three cabinets — Golden Defender, black Defender, and Stargate — with Scanner and profile screens glowing in the dark room</figcaption>
  </figure>

  <figure>
    <img src="images/47-detail-shot-golden-defender.jpg" alt="Four cabinets shown symmetrically">
    <figcaption><span class="num">47.</span>All four cabinets shown symmetrically head-on, screens lit including the Robotron intro</figcaption>
  </figure>

  <figure>
    <img src="images/48-detail-shot-golden-defender.jpg" alt="Black Defender boot screen">
    <figcaption><span class="num">48.</span>Angled shot catching the black Defender's boot screen — "Williams Electronics Inc. Presents Defender, Copyright 1980"</figcaption>
  </figure>

  <figure>
    <img src="images/49-detail-shot-golden-defender.jpg" alt="Golden Defender Scanner screen close-up">
    <figcaption><span class="num">49.</span>Close-up of the Golden Defender's screen in Scanner mode, showing enemy point values (Lander, Mutant, Baiter, Bomber, Pod, Swarmer) with coins resting on the control panel ledge</figcaption>
  </figure>

  <figure>
    <img src="images/50-detail-shot-golden-defender.jpg" alt="Three cabinet wide shot with leaderboard">
    <figcaption><span class="num">50.</span>Three-cabinet wide shot with the black Defender's Hall of Fame leaderboard clearly lit in the dim room</figcaption>
  </figure>

  <figure>
    <img src="images/51-dual-cabinet-dark-room-leaderboard.jpg" alt="Two Defender cabinets, leaderboard">
    <figcaption><span class="num">51.</span>Two Defender cabinets side by side — left mid-game on the Scanner screen, right displaying the "Defender Golden Greats" leaderboard</figcaption>
  </figure>

  <figure>
    <img src="images/52-dual-cabinet-dark-room-b.jpg" alt="Two cabinets in near darkness">
    <figcaption><span class="num">52.</span>Same two cabinets in near-total darkness, marquees glowing while the monitors sit very dim/low-brightness</figcaption>
  </figure>

  <figure>
    <img src="images/53-detail-shot-golden-defender.jpg" alt="Both Defenders showing matching leaderboards">
    <figcaption><span class="num">53.</span>Both Defender cabinets showing matching Hall of Fame leaderboards side by side, Stargate cabinet peeking in at the right edge</figcaption>
  </figure>

  <figure>
    <img src="images/54-detail-shot-golden-defender.jpg" alt="Darker exposure of the pairing">
    <figcaption><span class="num">54.</span>Darker exposure of the same pairing — left cabinet on Scanner, right cabinet on the Hall of Fame leaderboard</figcaption>
  </figure>

  <figure>
    <img src="images/55-detail-shot-golden-defender.jpg" alt="Angled close-up of Scanner screens">
    <figcaption><span class="num">55.</span>Angled close-up of the Golden Defender's Scanner screen with the second cabinet's matching screen visible alongside</figcaption>
  </figure>

  <figure>
    <img src="images/56-detail-shot-golden-defender.jpg" alt="Defender title screen close-up">
    <figcaption><span class="num">56.</span>Single cabinet shot centered on the "Williams Electronics Inc. Presents Defender" title/copyright screen</figcaption>
  </figure>

  <figure>
    <img src="images/57-detail-shot-golden-defender.jpg" alt="Hall of Fame leaderboard close-up">
    <figcaption><span class="num">57.</span>Single cabinet shot centered on the Hall of Fame leaderboard, Today's Greatest and All Time Greatest columns fully lit</figcaption>
  </figure>

</div>

<footer>
  Images 38–57 · Golden Defender &amp; arcade cabinet lineup
</footer>

</body>
</html>
